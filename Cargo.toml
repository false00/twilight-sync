[package]
name = "twilight-sync"
version = "0.3.0"
edition = "2024"
rust-version = "1.95"
description = "Local-network save sync and exclusive-play companion for Dusklight"
license = "MIT"
repository = "https://github.com/false00/twilight-sync"
homepage = "https://github.com/false00/twilight-sync"
readme = "README.md"

[dependencies]
anyhow = "1.0"
crossbeam-channel = "0.5"
directories = "6.0"
flate2 = "1.1"
crc32fast = "1.5"
fs2 = "0.4"
hex = "0.4"
postcard = { version = "1.1", features = ["alloc"] }
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
semver = "1.0"
sha2 = "0.10"
snow = "0.10"
socket2 = "0.6"
sysinfo = "0.39"
tempfile = "3.20"
time = { version = "0.3", features = ["formatting"] }
xxhash-rust = { version = "0.8", features = ["xxh3"] }
zeroize = "1.8"
zip = { version = "4.6", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow"] }
rfd = "0.15"
raw-window-handle = "0.6"
tray-icon = "0.24"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_Memory", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }
winreg = "0.55"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
